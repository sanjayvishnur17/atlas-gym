<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Gym - Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Admin Dashboard</h1>
            <nav class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/analytics" class="nav-link">Analytics</a>
            </nav>
        </header>

        <div id="login-section" class="login-section">
            <h2>Admin Login</h2>
            <div class="form-group">
                <input type="password" id="security-key" placeholder="Enter security key">
                <button onclick="verifyKey()" class="btn btn-primary">Login</button>
            </div>
        </div>

        <div id="admin-panel" class="admin-panel hidden">
            <div class="controls">
                <button onclick="downloadCSV()" class="btn btn-secondary">Download Attendance (CSV)</button>
                <button onclick="refreshRecords()" class="btn btn-primary">Refresh Records</button>
            </div>

            <div class="records-container">
                <h2>Attendance Records</h2>
                <div class="table-responsive">
                    <table id="records-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Name</th>
                                <th>Member ID</th>
                                <th>Check-in Time</th>
                                <th>Check-out Time</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="records-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="message" class="message"></div>

    <script>
        async function verifyKey() {
            const key = document.getElementById('security-key').value;
            
            try {
                const response = await fetch('/verify-key', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ key })
                });
                
                const data = await response.json();
                if (data.valid) {
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('admin-panel').classList.remove('hidden');
                    refreshRecords();
                } else {
                    showMessage('Invalid security key', 'error');
                }
            } catch (error) {
                showMessage('Error verifying key', 'error');
            }
        }

        async function refreshRecords() {
            try {
                const response = await fetch('/get-records');
                const records = await response.json();
                displayRecords(records);
            } catch (error) {
                showMessage('Error fetching records', 'error');
            }
        }

        function displayRecords(records) {
            const tbody = document.getElementById('records-body');
            tbody.innerHTML = '';

            records.forEach(record => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${record.date}</td>
                    <td>${record.name}</td>
                    <td>${record.member_id}</td>
                    <td>${formatDateTime(record.check_in)}</td>
                    <td>${record.check_out === 'Pending' ? 'Pending' : formatDateTime(record.check_out)}</td>
                    <td>
                        <button onclick="deleteRecord(${record.id})" class="btn btn-danger btn-small">Delete</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function formatDateTime(dateTimeStr) {
            if (!dateTimeStr || dateTimeStr === 'Pending') return 'Pending';
            return new Date(dateTimeStr).toLocaleString();
        }

        async function deleteRecord(id) {
            if (!confirm('Are you sure you want to delete this record?')) return;

            try {
                const response = await fetch(`/delete-record/${id}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                showMessage(data.message, 'success');
                refreshRecords();
            } catch (error) {
                showMessage('Error deleting record', 'error');
            }
        }

        function downloadCSV() {
            window.location.href = '/download-csv';
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            setTimeout(() => {
                messageDiv.className = 'message';
            }, 3000);
        }
    </script>
</body>
</html>

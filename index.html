<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Gym and Fitness Care</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Atlas Gym and Fitness Care</h1>
            <a href="/admin" class="admin-link">Admin Login</a>
        </header>
        
        <div class="attendance-form">
            <h2>Attendance Check-In/Out</h2>
            <div class="form-group">
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <input type="tel" id="mobile" placeholder="Enter mobile number" required>
            </div>
            <div class="button-group">
                <button onclick="checkIn()" class="btn btn-primary">Check In</button>
                <button onclick="checkOut()" class="btn btn-secondary">Check Out</button>
            </div>
        </div>
    </div>

    <div id="message" class="message"></div>

    <script>
        async function checkIn() {
            const name = document.getElementById('name').value;
            const mobile = document.getElementById('mobile').value;
            
            if (!name || !mobile) {
                showMessage('Please fill in all fields', 'error');
                return;
            }

            try {
                const response = await fetch('/check-in', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, mobile })
                });
                
                const data = await response.json();
                if (response.ok) {
                    showMessage(data.message, 'success');
                    clearForm();
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('Error during check-in', 'error');
            }
        }

        async function checkOut() {
            const mobile = document.getElementById('mobile').value;
            
            if (!mobile) {
                showMessage('Please enter your mobile number', 'error');
                return;
            }

            try {
                const response = await fetch('/check-out', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ mobile })
                });
                
                const data = await response.json();
                showMessage(data.message, 'success');
                clearForm();
            } catch (error) {
                showMessage('Error during check-out', 'error');
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            setTimeout(() => {
                messageDiv.className = 'message';
            }, 3000);
        }

        function clearForm() {
            document.getElementById('name').value = '';
            document.getElementById('mobile').value = '';
        }
    </script>
</body>
</html>
